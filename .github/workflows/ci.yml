name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The old single `checks` job ran nine steps back to back. These three run in
  # parallel, and the `checks` job at the end keeps its old name and needs all
  # of them, so anything requiring the `checks` status keeps working.
  static:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # strictNullChecks, scoped to src/game/** (finding 1.11).
      - run: npm run typecheck:game
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:pool

  sim-build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FryCards Poker bot-vs-bot run. `--invariants` exits non-zero on an
      # ENGINE fault only — a bot action the engine refused, chips created or
      # destroyed, a match that never ends — never on a balance-target miss.
      # A small count catches invariant regressions; balance passes against
      # the four spec targets are run by hand (`npm run sim:poker -- --matches
      # 400`, add `--strict` to gate on them).
      - run: npm run sim:poker -- --matches 16 --invariants
      - run: npm run build
      # Fails if the eager (first-paint) JS or CSS grows past its budget.
      - run: npm run size:check

  checks:
    runs-on: ubuntu-latest
    needs: [static, test, sim-build]
    steps:
      - run: echo "static, test and sim-build all passed"

  # The tap-target, reflow, focus-trap and WCAG harnesses. All three exit
  # non-zero on a finding and none of them was invoked by CI, so every
  # accessibility fix they protect only held when someone remembered to run
  # them locally.
  harnesses:
    runs-on: ubuntu-latest
    # These are slow: a full 29-state screen sweep (~78min on a shared-CPU
    # box) plus a handful of poker matches driven through the table UI. Bounded so a
    # hang fails the job rather than burning the 6-hour default, and generous
    # enough that a slow runner does not.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Both harnesses drive the Vite dev server (meta-preview.html /
      # table-preview.html), the same way they are run locally.
      - name: Start dev server
        run: |
          # setsid + nohup so the server outlives this step's shell.
          setsid nohup npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "dev server up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not come up"; cat /tmp/vite.log; exit 1
      - run: npm run audit:screens
      - run: npm run drive:table
