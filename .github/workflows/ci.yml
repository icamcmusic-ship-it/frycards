name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # The browser-driven harnesses live in the `harnesses` job below, which
    # installs Chromium; this job never needs the binaries.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # strictNullChecks, scoped to src/game/** (finding 1.11).
      - run: npm run typecheck:game
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run verify:pool
      # 4 games/pairing, not 20. The sim now EXITS NON-ZERO on an engine
      # invariant violation, so this step is a real gate — and at ~11,000
      # games it was by far the most expensive step in the pipeline while
      # being incapable of failing. Invariant regressions show up at 4
      # games/pairing too; balance passes are run by hand at higher counts.
      - run: npm run sim:v4 -- 4
      - run: npm run build

  # The tap-target, reflow, focus-trap and WCAG harnesses. All three exit
  # non-zero on a finding and none of them was invoked by CI, so every
  # accessibility fix they protect only held when someone remembered to run
  # them locally.
  harnesses:
    runs-on: ubuntu-latest
    # These are slow: a full 29-state screen sweep plus six driven matches
    # measured ~78min and ~35min respectively on a shared-CPU box. Bounded so a
    # hang fails the job rather than burning the 6-hour default, and generous
    # enough that a slow runner does not.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Both harnesses drive the Vite dev server (meta-preview.html /
      # board-preview.html), the same way they are run locally.
      - name: Start dev server
        run: |
          # setsid + nohup so the server outlives this step's shell.
          setsid nohup npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "dev server up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "dev server did not come up"; cat /tmp/vite.log; exit 1
      - run: npm run audit:screens
      - run: npm run drive:match
